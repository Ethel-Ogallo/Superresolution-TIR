# sweep sans spade
# configs/sweep.yaml
program: scripts/training/train.py
project: TIR_SISR_v2   
method: bayes       
metric:
  name: val/water_mae
  goal: minimize    

early_terminate:
  type: hyperband
  min_iter: 10        # don't kill runs before epoch 10
  eta: 2              # aggressiveness — 2 or 3 is standard (3 = more aggressive)
  s: 2                # number of brackets

parameters:
  # --- Fixed Arguments for Training Stability ---
  lr:
    value: 0.0001
  batch_size:
    value: 4
  max_epochs:
    value: 80
  patience:
    value: 15
  num_workers:
    value: 4
  seed:
    value: 42
  use_spade:
    value: false
  d_lr_scale:
    value: 1.0 
  lambda_perceptual:
    value: 0.791
  lambda_adversarial:
    value: 0.061
  lambda_w:
    value: 1.562
  lambda_nw:
    value: 0.353
  group:
    value: "sweep_grad"
         
  # --- Hyperparameters to Sweep ---
  lambda_g:
    distribution: log_uniform_values
    min: 0.7
    max: 2.5      
            

