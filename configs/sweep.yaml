# sweep sans spade
# configs/sweep.yaml
program: scripts/training/train.py
project: TIR_SISR_v2   
method: bayes       
metric:
  name: val/water_mae
  goal: minimize    

early_terminate:
  type: hyperband
  min_iter: 10        # don't kill runs before epoch 10
  eta: 2              # aggressiveness — 2 or 3 is standard (3 = more aggressive)
  s: 2                # number of brackets

parameters:
  # --- Fixed Arguments for Training Stability ---
  lr:
    value: 0.0001
  batch_size:
    value: 4
  max_epochs:
    value: 80
  patience:
    value: 15
  num_workers:
    value: 4
  seed:
    value: 42
  use_spade:
    value: false
  d_lr_scale:
    value: 1.0 
  group:
    value: "sweep_all"
           
  # --- Hyperparameters to Sweep ---
  lambda_perceptual:
    min: 0.5
    max: 1.5              
  
  lambda_adversarial:
    min: 0.01
    max: 0.10    

  lambda_g:
    min: 0.5
    max: 5.0            

  lambda_w:
    min: 1.0
    max: 2.5              
  
  lambda_nw:
    min: 0.3
    max: 1.2              


