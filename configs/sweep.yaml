# configs/sweep.yaml
program: scripts/training/train.py
project: TIR_SISR_v2   
method: grid       
metric:
  name: val/water_mae
  goal: minimize    

parameters:
  # --- Fixed Arguments for Training Stability ---
  batch_size:
    value: 4
  max_epochs:
    value: 50
  patience:
    value: 10
  num_workers:
    value: 4
  seed:
    value: 42
  use_spade:
    value: true
  group:
    value: "sweep4_cosia"
  
  # --- Your Fixed, Optimized Loss Weights ---
  lambda_nw:
    value: 0.6549
  lambda_w:
    value: 1.8146
  lambda_g:
    value: 0.1323
  lambda_adversarial:
    value: 0.0831
  lambda_perceptual:
    value: 0.6169
    
  # --- Hyperparameters to Sweep (Discrete Cross-Matrix) ---
  # Base Generator Learning Rate
  lr:
    values: [1e-4, 5e-5]

  # Discriminator Scale Multiplier
  d_lr_scale:
    values: [1.0, 0.4, 0.2, 0.1]
         
