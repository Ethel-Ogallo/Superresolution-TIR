# sweep sans spade
# configs/sweep.yaml
program: scripts/training/train.py
project: TIR_SISR_v2   
method: bayes       
metric:
  name: val/water_mae
  goal: minimize    

parameters:
  # --- Fixed Arguments for Training Stability ---
  lr:
    value: 0.0001
  batch_size:
    value: 4
  max_epochs:
    value: 80
  patience:
    value: 15
  num_workers:
    value: 4
  seed:
    value: 42
  use_spade:
    value: false     
  group:
    value: "sweep_all_v2"

  # --- Water target ---
  lambda_w:
    min: 1.0
    max: 4.0      # Gives total freedom to prioritize the narrow river channels
  lambda_nw:
    min: 0.01
    max: 0.8      # Allows the model to find the right background balance

  # --- Deterministic Structural Edge Force ---
  lambda_g:
    min: 0.1
    max: 2.0      # Centered beautifully around the paper's gamma = 1.0

  # --- Generative & Perceptual Priors (as per STGAN paper) ---
  lambda_adversarial:
    min: 0.0001
    max: 0.005    # Safely brackets the paper's beta = 0.001 near the upper middle
  lambda_perceptual:
    min: 0.0
    max: 0.1      # Caps exactly at the paper's alpha = 0.1, including 0.0 as a baseline




