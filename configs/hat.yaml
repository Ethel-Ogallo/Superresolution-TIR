# hat_config.yaml
model_class: HATModule
img_size:       64         # was 128, matches LR patch size
window_size:    16         # 64 % 16 == 0 ✓
embed_dim:      180
depths:         [6, 6, 6, 6, 6, 6]
num_heads:      [6, 6, 6, 6, 6, 6]
mlp_ratio:      2.0
compress_ratio: 3
squeeze_factor: 30
overlap_ratio:  0.5
upsampler:      pixelshuffle
precision:      "bf16-mixed"