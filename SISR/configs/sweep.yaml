# configs/sweep.yaml
program: scripts/training/train.py
project: TIR_SISR_final   
method: bayes       
metric:
  name: val/water_mae
  goal: minimize    

parameters:
  # --- Fixed Arguments for Training Stability ---
  lr:
    value: 1e-4
  d_lr_scale:
    value: 1.0
  batch_size:
    value: 4
  max_epochs:
    value: 50
  patience:
    value: 10
  num_workers:
    value: 4
  seed:
    value: 42
  use_spade:
    value: false
  group:
    value: "sweep_wt2"

  # --- Hyperparameters to Sweep ---
  lambda_nw:
    distribution: uniform
    min: 0.5
    max: 1.0

  lambda_w:
    distribution: uniform
    min: 1.5
    max: 3.0

  lambda_g:
    distribution: uniform
    min: 0.1
    max: 0.4

  lambda_perceptual:
    distribution: log_uniform_values
    min: 0.3
    max: 1.0

  lambda_adversarial:
    distribution: log_uniform_values
    min: 0.02
    max: 0.1
  
