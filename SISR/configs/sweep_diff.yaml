# configs/sweep.yaml
program: SISR/scripts/training/02_diff_train.py
project: TIR_SISR_final   
method: bayes       
metric:
  name: val/water_mae
  goal: minimize    

parameters:
  # --- Fixed Arguments for Training Stability ---
  lr:
    value: 1e-4
  batch_size:
    value: 4
  max_epochs:
    value: 50
  patience:
    value: 10
  num_workers:
    value: 4
  seed:
    value: 42
  use_spade:
    value: false
  group:
    value: "fastdiff_lambda_sweep"

  # --- Hyperparameters to tune ---
  lambda_nw:
    distribution: uniform
    min: 0.5
    max: 1.0

  lambda_w:
    distribution: uniform
    min: 1.5
    max: 3.0

  lambda_g:
    distribution: uniform
    min: 0.1
    max: 0.4

  
